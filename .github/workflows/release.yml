# .github/workflows/release.yml
# Se activa cuando se pushea un tag tipo v1.2.0
# Genera el zip de actualización y lo adjunta al Release de GitHub

name: Build & Release Update Package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-update-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extraer versión del tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generar zip de actualización
        run: python build_release.py ${{ steps.version.outputs.VERSION }}

      - name: Crear GitHub Release y subir assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LexView Pro v${{ steps.version.outputs.VERSION }}"
          body_path: changelogs/${{ steps.version.outputs.VERSION }}.md
          fail_on_unmatched_files: false
          files: |
            dist/lexview-update-${{ steps.version.outputs.VERSION }}.zip
            dist/lexview-update-${{ steps.version.outputs.VERSION }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opcional: notificar al VPS para actualizar CURRENT_VERSION automáticamente
      # Requiere un secret VPS_DEPLOY_KEY con acceso SSH al servidor
      - name: Actualizar versión en VPS
        if: secrets.VPS_DEPLOY_KEY != ''
        uses: appleboy/ssh-action@v1
        with:
          host: 146.190.215.54
          username: root
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            VERSION="${{ steps.version.outputs.VERSION }}"
            sed -i "s/^CURRENT_VERSION = .*/CURRENT_VERSION = \"$VERSION\"/" /opt/lexview_server/server.py
            systemctl restart lexview
            echo "VPS actualizado a v$VERSION"
